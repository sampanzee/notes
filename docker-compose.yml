services:
  notes:
    build: /volume1/docker/notes
    image: notes:latest
    container_name: notes
    restart: unless-stopped
    ports:
      - "3090:3000"
    volumes:
      - /volume1/docker/notes/data:/data
    environment:
      - TZ=Europe/Berlin
    labels:
      - com.centurylinklabs.watchtower.enable=false
